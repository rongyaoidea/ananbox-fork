name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-check:
    name: Compile check (no native)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK without native code
        run: ./gradlew :app:assembleDebug -PskipNative --stacktrace --console=plain

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ananbox-debug-no-native
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  native-build:
    name: Full NDK build
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;30.0.3" \
            "build-tools;33.0.0" \
            "cmake;3.22.1" \
            "ndk;23.1.7779620"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build python3

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (NDK, both ABIs)
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ananbox-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
